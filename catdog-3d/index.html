<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CAT ↔ DOG ↔ BOUQUET — 3D конструкція</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; }
    #app { position:fixed; inset:0; }
    #ui { position:fixed; left:16px; top:16px; width:min(360px,calc(100vw - 32px)); padding:14px; border:1px solid #3a3a3a; border-radius:16px; background:rgba(20,20,20,.88); backdrop-filter:blur(12px); z-index:5; }
    h1 { font-size:17px; margin:0 0 8px; }
    p { font-size:12px; line-height:1.45; margin:6px 0; color:#cfcfcf; }
    .buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:10px 0; }
    button { border:1px solid #454545; background:#222; color:#eee; padding:9px 6px; border-radius:10px; cursor:pointer; font-weight:650; }
    button.active { background:#eee; color:#111; border-color:#eee; }
    .row { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; }
    #facts { margin-top:10px; padding-top:10px; border-top:1px solid #333; font-size:12px; color:#ddd; white-space:pre-line; }
    #legend { position:fixed; right:16px; bottom:16px; z-index:5; padding:10px 12px; border-radius:12px; background:rgba(20,20,20,.84); font-size:11px; line-height:1.6; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
    @media (max-width:700px){ #ui{width:calc(100vw - 24px);left:12px;top:12px} #legend{display:none} }
  </style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <h1>CAT ↔ DOG ↔ BOUQUET — 3D система</h1>
  <p>Концептуальна перевірка трансформації з акцентом на котячий хвіст із синтепонових «ковбасних» секцій.</p>
  <div class="buttons">
    <button data-mode="tail" class="active">Хвіст</button>
    <button data-mode="cat">Кіт</button>
    <button data-mode="dog">Собака</button>
    <button data-mode="bouquet">Букет</button>
  </div>
  <div class="row"><input id="seams" type="checkbox" checked><label for="seams">Показувати поперечні строчки</label></div>
  <div class="row"><input id="hidden" type="checkbox" checked><label for="hidden">Показати приховані вузли напівпрозоро</label></div>
  <div id="facts"></div>
</div>
<div id="legend">
  <div><span class="dot" style="background:#e8dfcf"></span>кіт / молочна тканина</div>
  <div><span class="dot" style="background:#5c3b2e"></span>собака / шоколад</div>
  <div><span class="dot" style="background:#879078"></span>обгортка / шавлія</div>
  <div><span class="dot" style="background:#b98587"></span>лінії згину / акцент</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.querySelector('#app');
const facts = document.querySelector('#facts');
const seamsBox = document.querySelector('#seams');
const hiddenBox = document.querySelector('#hidden');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(8, 6, 12);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,1.4,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x333333,2.2));
const key = new THREE.DirectionalLight(0xffffff,2.8); key.position.set(6,10,7); key.castShadow=true; scene.add(key);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({color:0x191919, roughness:1}));
floor.rotation.x=-Math.PI/2; floor.position.y=-2.2; floor.receiveShadow=true; scene.add(floor);
const grid = new THREE.GridHelper(30,30,0x333333,0x222222); grid.position.y=-2.19; scene.add(grid);

const COLORS = { cat:0xe8dfcf, dog:0x5c3b2e, sage:0x879078, rose:0xb98587, dark:0x2b211e };
const model = new THREE.Group(); scene.add(model);
let seamObjects=[]; let hiddenObjects=[];

function mat(color, opacity=1){
  return new THREE.MeshStandardMaterial({color, roughness:.72, metalness:0, transparent:opacity<1, opacity});
}

function ball(pos, r, color, opacity=1, sx=1, sy=1, sz=1){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,20),mat(color,opacity));
  m.position.copy(pos); m.scale.set(sx,sy,sz); m.castShadow=true; model.add(m); return m;
}

function tube(a,b,r,color,opacity=1){
  const mid=a.clone().add(b).multiplyScalar(.5); const len=a.distanceTo(b);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,24,1,false),mat(color,opacity));
  m.position.copy(mid); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize()); m.castShadow=true; model.add(m);
  ball(a,r,color,opacity); ball(b,r,color,opacity); return m;
}

function seamAt(pos, tangent, r){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(r*1.04,0.035,8,28),new THREE.MeshBasicMaterial({color:COLORS.rose}));
  ring.position.copy(pos); ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),tangent.clone().normalize()); model.add(ring); seamObjects.push(ring); return ring;
}

function segmentedTail(points, r=.32, color=COLORS.cat, opacity=1){
  const group=[];
  for(let i=0;i<points.length-1;i++){
    tube(points[i],points[i+1],r*(1-i/(points.length*8)),color,opacity);
    if(i>0) seamAt(points[i],points[i+1].clone().sub(points[i-1]),r);
  }
  return group;
}

function ear(pos, rotZ, color, scale=1){
  const shape=new THREE.Shape(); shape.moveTo(-.38,0); shape.lineTo(.38,0); shape.lineTo(0,.92); shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{depth:.09,bevelEnabled:true,bevelSize:.05,bevelThickness:.04,bevelSegments:2});
  const m=new THREE.Mesh(geo,mat(color)); m.position.copy(pos); m.rotation.z=rotZ; m.scale.setScalar(scale); m.castShadow=true; model.add(m); return m;
}

function eye(x,y,z){ ball(new THREE.Vector3(x,y,z),.075,0x191919); }
function clearModel(){ while(model.children.length){ const c=model.children.pop(); c.geometry?.dispose(); if(c.material){ if(Array.isArray(c.material)) c.material.forEach(m=>m.dispose()); else c.material.dispose(); }} seamObjects=[]; hiddenObjects=[]; }

function catHead(pos, s=1){
  ball(pos,.78*s,COLORS.cat,1,1.08,.93,.92);
  ear(pos.clone().add(new THREE.Vector3(-.55*s,.55*s,0)), .12, COLORS.cat,.8*s);
  ear(pos.clone().add(new THREE.Vector3(.55*s,.55*s,0)), -.12, COLORS.cat,.8*s);
  eye(pos.x-.25*s,pos.y+.08*s,pos.z+.69*s); eye(pos.x+.25*s,pos.y+.08*s,pos.z+.69*s);
  ball(pos.clone().add(new THREE.Vector3(0,-.12*s,.72*s)),.09*s,0x7b4e4e);
}
function dogHead(pos,s=1){
  ball(pos,.82*s,COLORS.dog,1,1.03,.94,1.0);
  const e1=ball(pos.clone().add(new THREE.Vector3(-.7*s,.05*s,0)),.38*s,COLORS.dog,1,.65,1.5,.35); e1.rotation.z=.42;
  const e2=ball(pos.clone().add(new THREE.Vector3(.7*s,.05*s,0)),.38*s,COLORS.dog,1,.65,1.5,.35); e2.rotation.z=-.42;
  eye(pos.x-.25*s,pos.y+.12*s,pos.z+.72*s); eye(pos.x+.25*s,pos.y+.12*s,pos.z+.72*s);
  ball(pos.clone().add(new THREE.Vector3(0,-.17*s,.78*s)),.11*s,0x191919);
}

function modeTail(){
  const pts=[];
  for(let i=0;i<10;i++){
    const t=i/9; const ang=t*1.55*Math.PI;
    pts.push(new THREE.Vector3(-2.4+3.2*t, -.7+2.8*t, .8*Math.sin(ang)));
  }
  segmentedTail(pts,.39,COLORS.cat);
  ball(new THREE.Vector3(-2.55,-.78,0),.48,COLORS.cat,1,1.2,.9,.9);
  facts.textContent='ХВІСТ — 9 м’яких секцій\nГотова довжина: ≈ 52 см\nШирина біля основи: 9–10 см\nКрок поперечних строчок: 5–6 см\nПризначення: хвіст кота → стабілізатор DOG → спіральний бутон у букеті.';
  camera.position.set(8,5,11); controls.target.set(-.5,.7,0);
}

function modeCat(){
  const body=ball(new THREE.Vector3(0,.1,0),1.42,COLORS.cat,1,1.35,.95,.9);
  catHead(new THREE.Vector3(1.25,.85,.35),.9);
  const pts=[new THREE.Vector3(-1.3,.15,0),new THREE.Vector3(-2.0,.3,.2),new THREE.Vector3(-2.5,.8,.3),new THREE.Vector3(-2.5,1.45,.15),new THREE.Vector3(-2.05,1.9,-.05),new THREE.Vector3(-1.45,1.8,-.25),new THREE.Vector3(-1.05,1.35,-.2)];
  segmentedTail(pts,.34,COLORS.cat);
  facts.textContent='КІТ\nХвіст обгортає корпус і сам формує силует — окремої фурнітури немає.\nКотяча голова залишається окремим м’яким вузлом; у режимі DOG вона складається під груди.';
  camera.position.set(7,4.5,10); controls.target.set(0,.4,0);
}

function modeDog(){
  ball(new THREE.Vector3(0,.15,0),1.4,COLORS.dog,1,1.65,.78,.82);
  dogHead(new THREE.Vector3(1.75,.65,.25),.92);
  tube(new THREE.Vector3(-.9,-.65,.2),new THREE.Vector3(-1.15,-1.7,.25),.34,COLORS.dog);
  tube(new THREE.Vector3(.6,-.65,.25),new THREE.Vector3(.7,-1.7,.25),.34,COLORS.dog);
  const foldedCat=ball(new THREE.Vector3(1.0,-.75,-.15),.75,COLORS.cat,.28,1.15,.7,.9); hiddenObjects.push(foldedCat);
  const tailPts=[new THREE.Vector3(-1.9,.3,0),new THREE.Vector3(-2.35,.7,.05),new THREE.Vector3(-2.45,1.2,.1),new THREE.Vector3(-2.15,1.55,.05)]; segmentedTail(tailPts,.28,COLORS.cat,.42); hiddenObjects.push(...model.children.slice(-15));
  facts.textContent='СОБАКА\nКотяча голова не висить збоку: вона підвертається під груди й працює як м’яка грудна подушка.\nКотячий хвіст складається вздовж задньої частини та стабілізує форму; його секції залишаються гнучкими.';
  camera.position.set(8,4,11); controls.target.set(0,.1,0);
}

function bud(center,color,r=.58){
  const pts=[]; const turns=1.55; const n=10;
  for(let i=0;i<n;i++){
    const t=i/(n-1), a=t*Math.PI*2*turns, rr=(1-t)*1.05+.12;
    pts.push(center.clone().add(new THREE.Vector3(Math.cos(a)*rr, Math.sin(a)*rr, .12*i)));
  }
  segmentedTail(pts,r*.42,color);
}

function modeBouquet(){
  // stems / folded quilted body
  tube(new THREE.Vector3(-.75,-1.9,0),new THREE.Vector3(-.55,1.1,0),.34,COLORS.sage);
  tube(new THREE.Vector3(.0,-1.9,0),new THREE.Vector3(.05,1.25,.05),.34,COLORS.sage);
  tube(new THREE.Vector3(.75,-1.9,0),new THREE.Vector3(.65,1.05,0),.34,COLORS.sage);
  // animal faces are characters, not counted as flowers
  catHead(new THREE.Vector3(-1.15,1.65,.25),.62);
  dogHead(new THREE.Vector3(1.15,1.55,.15),.62);
  // 3 actual textile buds, one created by cat tail spiral
  bud(new THREE.Vector3(0,2.05,-.35),COLORS.rose,.62);
  bud(new THREE.Vector3(-.45,1.25,-.5),COLORS.sage,.52);
  bud(new THREE.Vector3(.45,1.15,-.55),COLORS.cat,.52);
  // wrapper panels
  const wrap=ball(new THREE.Vector3(0,-.35,-.15),1.55,COLORS.sage,1,1.05,1.25,.35); wrap.rotation.z=.02;
  facts.textContent='БУКЕТ ≈ 100 см у реальному крої\nКомпозиція: 3 текстильні бутони + мордочка киці + мордочка собаки.\nОдин із трьох бутонів формується саме котячим хвостом: секції скручуються спіраллю.\nТому немає проблеми «дві квітки» — тварини читаються як персонажі серед трьох бутонів.';
  camera.position.set(7,5,12); controls.target.set(0,.3,0);
}

const builders={tail:modeTail,cat:modeCat,dog:modeDog,bouquet:modeBouquet};
let current='tail';
function rebuild(){ clearModel(); builders[current](); updateVisibility(); }
function updateVisibility(){ seamObjects.forEach(o=>o.visible=seamsBox.checked); hiddenObjects.forEach(o=>o.visible=hiddenBox.checked); }

document.querySelectorAll('button[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{
  current=btn.dataset.mode; document.querySelectorAll('button[data-mode]').forEach(b=>b.classList.toggle('active',b===btn)); rebuild();
}));
seamsBox.addEventListener('change',updateVisibility); hiddenBox.addEventListener('change',updateVisibility);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
rebuild();
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
</script>
</body>
</html>
