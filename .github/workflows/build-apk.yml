name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SNOWMAN_KEYSTORE_B64: ${{ secrets.SNOWMAN_KEYSTORE_B64 }}
  SNOWMAN_STORE_PASSWORD: ${{ secrets.SNOWMAN_STORE_PASSWORD }}
  SNOWMAN_KEY_ALIAS: ${{ secrets.SNOWMAN_KEY_ALIAS }}
  SNOWMAN_KEY_PASSWORD: ${{ secrets.SNOWMAN_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        run: |
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Apply v10 gameplay polish
        run: python3 scripts/apply_polish_v10.py

      - name: Apply v11 Year 2 story
        run: python3 scripts/apply_year2_v11.py

      - name: Apply v12 season and wardrobe
        run: python3 scripts/apply_season_v12.py

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Sign with persistent release key
        if: env.SNOWMAN_KEYSTORE_B64 != ''
        run: |
          printf '%s' "$SNOWMAN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/snowman-release.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/snowman-release.jks" \
            --ks-key-alias "$SNOWMAN_KEY_ALIAS" \
            --ks-pass env:SNOWMAN_STORE_PASSWORD \
            --key-pass env:SNOWMAN_KEY_PASSWORD \
            --out SnowmanGame.apk \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose SnowmanGame.apk
          rm -f "$RUNNER_TEMP/snowman-release.jks"

      - name: Prepare debug APK fallback
        if: env.SNOWMAN_KEYSTORE_B64 == ''
        run: cp app/build/outputs/apk/debug/app-debug.apk SnowmanGame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnowmanGame-APK
          path: SnowmanGame.apk
          if-no-files-found: error
