name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        run: |
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Normalize ClassOne source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/snowmangame/ClassOneActivity.java')
          s = p.read_text(encoding='utf-8')
          bad = 'float[] xs={w*.27f,w*.52f,w*.76f},[]ys={safeTop+dp(320),safeTop+dp(385),safeTop+dp(312)};'
          good = 'float[] xs={w*.27f,w*.52f,w*.76f}, ys={safeTop+dp(320),safeTop+dp(385),safeTop+dp(312)};'
          if bad in s:
              p.write_text(s.replace(bad, good, 1), encoding='utf-8')
              print('Normalized ClassOneActivity syntax')
          elif good in s:
              print('ClassOneActivity already normalized')
          else:
              raise SystemExit('ClassOne compile pattern changed; review source')
          PY

      - name: Normalize current school-life sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          school_path = Path('app/src/main/java/com/snowmangame/SchoolWeekActivity.java')
          school = school_path.read_text(encoding='utf-8')

          if 'school_playerpaced_v18_4' not in school:
              subprocess.check_call(['python', 'scripts/apply_playerpaced_school_v18_4.py'])
          else:
              print('Player-paced school source already normalized')

          school = school_path.read_text(encoding='utf-8')
          if 'NotificationScheduler.onSchoolOpened(this);' not in school:
              subprocess.check_call(['python', 'scripts/apply_notifications_v18_5.py'])
          else:
              print('v18.6 school notification integration already normalized')

          call_path = Path('app/src/main/java/com/snowmangame/SchoolCallActivity.java')
          if not call_path.exists():
              raise SystemExit('SchoolCallActivity missing after v18.6 normalization')
          call = call_path.read_text(encoding='utf-8')
          bad = 'performClick();finish();return true;'
          good = 'performClick();((Activity)ctx).finish();return true;'
          if bad in call:
              subprocess.check_call(['python', 'scripts/apply_school_call_fix_v18_6.py'])
          elif good in call:
              print('SchoolCallActivity finish target already normalized')
          else:
              raise SystemExit('SchoolCallActivity finish pattern changed; review source')
          PY

      - name: Validate school-life integration
        run: |
          test -f app/src/main/java/com/snowmangame/SchoolWeekActivity.java
          test -f app/src/main/java/com/snowmangame/SchoolCallActivity.java
          test -f app/src/main/java/com/snowmangame/SnowSwimActivity.java
          test -f app/src/main/java/com/snowmangame/NotificationScheduler.java
          test -f app/src/main/java/com/snowmangame/SnowReminderReceiver.java
          grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SchoolWeekActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SchoolCallActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SnowSwimActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SnowReminderReceiver"' app/src/main/AndroidManifest.xml
          grep -q 'school_year_school_done' app/src/main/java/com/snowmangame/SchoolWeekActivity.java
          grep -q 'school_year_weekend_done' app/src/main/java/com/snowmangame/SchoolWeekActivity.java
          grep -q 'NotificationScheduler.onSchoolOpened(this);' app/src/main/java/com/snowmangame/SchoolWeekActivity.java
          grep -q 'NotificationScheduler.onDayCompleted(ctx);' app/src/main/java/com/snowmangame/SchoolWeekActivity.java
          grep -q 'versionCode 39' app/build.gradle
          grep -q 'versionName "18.6"' app/build.gradle
          ! grep -q '\[\]ys=' app/src/main/java/com/snowmangame/ClassOneActivity.java

      - name: Persist normalized sources to main
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/snowmangame/ClassOneActivity.java \
            app/src/main/java/com/snowmangame/SchoolWeekActivity.java \
            app/src/main/java/com/snowmangame/SchoolCallActivity.java \
            app/src/main/java/com/snowmangame/SnowSwimActivity.java
          if git diff --cached --quiet; then
            echo 'Sources already normalized; nothing to persist.'
          else
            git commit -m 'Normalize generated v18.6 gameplay sources'
            git push origin HEAD:main
          fi

      - name: Build current source tree
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Decode stable prototype update key
        run: |
          base64 --decode .github/signing/snowman-test-update-key.b64 > "$RUNNER_TEMP/snowman-test-update.jks"

      - name: Align and sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/SnowmanGame-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/snowman-test-update.jks" \
            --ks-key-alias snowman_release \
            --ks-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' \
            --key-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out SnowmanGame.apk \
            "$RUNNER_TEMP/SnowmanGame-aligned.apk"

      - name: Verify installable signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SnowmanGame.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 SnowmanGame.apk
          file SnowmanGame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnowmanGame-APK
          path: SnowmanGame.apk
          if-no-files-found: error
