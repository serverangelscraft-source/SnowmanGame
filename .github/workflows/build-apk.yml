name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        run: |
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Validate canonical v18.9 source tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('app/src/main/java/com/snowmangame')
          manifest=Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          gradle=Path('app/build.gradle').read_text(encoding='utf-8')
          main=(root/'MainActivity.java').read_text(encoding='utf-8')
          journey=(root/'JourneyActivity.java').read_text(encoding='utf-8')
          school=(root/'SchoolWeekActivity.java').read_text(encoding='utf-8')

          sources={}
          for path in root.glob('*Activity.java'):
              text=path.read_text(encoding='utf-8')
              m=re.search(r'public\s+class\s+(\w+Activity)\s+extends\s+Activity',text)
              if m:sources[m.group(1)]=path
          registered=set(re.findall(r'android:name="\.([A-Za-z0-9_]+Activity)"',manifest))
          missing=sorted(set(sources)-registered)
          stale=sorted(registered-set(sources))
          if missing:raise SystemExit('Activity source missing from manifest: '+', '.join(missing))
          if stale:raise SystemExit('Manifest points to missing Activity: '+', '.join(stale))

          referenced=set()
          for path in root.glob('*.java'):
              referenced.update(re.findall(r'\b([A-Za-z0-9_]+Activity)\.class\b',path.read_text(encoding='utf-8')))
          bad=sorted(referenced-registered)
          if bad:raise SystemExit('Unregistered Activity refs: '+', '.join(bad))

          checks={
            'no orphan GradeTwo':not (root/'GradeTwoActivity.java').exists(),
            'ClassOne syntax normalized':'[]ys=' not in (root/'ClassOneActivity.java').read_text(encoding='utf-8'),
            '2-A route active':'new Intent(ctx,SchoolWeekActivity.class)' in (root/'ClassOneActivity.java').read_text(encoding='utf-8'),
            'player-paced school':'school_year_school_done' in school and 'school_year_weekend_done' in school,
            'date refresh':'refreshDateIfNeeded' in school,
            'grade11 terminal guard':'grade>=11' in school,
            'HUD simplified':'c.drawText("★ "+score' not in main and 'timeText(elapsed())+" • рек "' not in main,
            'year7 main route enters school':'year>=7?SchoolActivity.class:DeliveryActivity.class' in main,
            'arrival does not auto advance':'if(!yearAdvanced){yearAdvanced=true;year=nextYear' not in journey,
            'explicit year confirmation':'confirmYearAdvance()' in journey and 'ПІДТВЕРДИТИ ПЕРЕХІД' in journey,
            'journey school fallback':'startSchool()' in journey,
            'notification permission':'android.permission.POST_NOTIFICATIONS' in manifest,
            'boot receiver':'android:name=".SnowReminderReceiver"' in manifest,
            'versionCode 42':re.search(r'versionCode\s+42\b',gradle) is not None,
            'versionName 18.9':'versionName "18.9"' in gradle,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:raise SystemExit('Source integrity checks failed: '+'; '.join(failed))
          print('Canonical v18.9 source tree OK')
          PY

      - name: Build current source tree
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Decode stable prototype update key
        run: |
          base64 --decode .github/signing/snowman-test-update-key.b64 > "$RUNNER_TEMP/snowman-test-update.jks"

      - name: Align and sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/SnowmanGame-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/snowman-test-update.jks" \
            --ks-key-alias snowman_release \
            --ks-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' \
            --key-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out SnowmanGame.apk \
            "$RUNNER_TEMP/SnowmanGame-aligned.apk"

      - name: Verify installable signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SnowmanGame.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 SnowmanGame.apk
          file SnowmanGame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnowmanGame-APK
          path: SnowmanGame.apk
          if-no-files-found: error
