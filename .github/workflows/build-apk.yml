name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        run: |
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Apply ClassOne compile fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/snowmangame/ClassOneActivity.java')
          s = p.read_text(encoding='utf-8')
          bad = 'float[] xs={w*.27f,w*.52f,w*.76f},[]ys={safeTop+dp(320),safeTop+dp(385),safeTop+dp(312)};'
          good = 'float[] xs={w*.27f,w*.52f,w*.76f}, ys={safeTop+dp(320),safeTop+dp(385),safeTop+dp(312)};'
          if bad in s:
              p.write_text(s.replace(bad, good), encoding='utf-8')
          elif good not in s:
              raise SystemExit('ClassOne compile pattern changed; review source')
          PY

      - name: Apply current school-life patch chain
        run: |
          python scripts/apply_playerpaced_school_v18_4.py
          python scripts/apply_notifications_v18_5.py
          python scripts/apply_school_call_fix_v18_6.py

      - name: Validate school-life integration
        run: |
          test -f app/src/main/java/com/snowmangame/SchoolWeekActivity.java
          test -f app/src/main/java/com/snowmangame/SchoolCallActivity.java
          test -f app/src/main/java/com/snowmangame/SnowSwimActivity.java
          test -f app/src/main/java/com/snowmangame/NotificationScheduler.java
          test -f app/src/main/java/com/snowmangame/SnowReminderReceiver.java
          grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SchoolWeekActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SchoolCallActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SnowSwimActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SnowReminderReceiver"' app/src/main/AndroidManifest.xml
          grep -q 'school_year_school_done' app/src/main/java/com/snowmangame/SchoolWeekActivity.java
          grep -q 'school_year_weekend_done' app/src/main/java/com/snowmangame/SchoolWeekActivity.java

      - name: Build current source tree
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Decode stable prototype update key
        run: |
          base64 --decode .github/signing/snowman-test-update-key.b64 > "$RUNNER_TEMP/snowman-test-update.jks"

      - name: Align and sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/SnowmanGame-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/snowman-test-update.jks" \
            --ks-key-alias snowman_release \
            --ks-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' \
            --key-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out SnowmanGame.apk \
            "$RUNNER_TEMP/SnowmanGame-aligned.apk"

      - name: Verify installable signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SnowmanGame.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 SnowmanGame.apk
          file SnowmanGame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnowmanGame-APK
          path: SnowmanGame.apk
          if-no-files-found: error
