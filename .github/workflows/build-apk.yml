name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.11.1
        run: |
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Validate canonical v18.21 source tree and school path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          main=Path('app/src/main/java/com/snowmangame/MainActivity.java').read_text(encoding='utf-8')
          school=Path('app/src/main/java/com/snowmangame/SchoolWeekActivity.java').read_text(encoding='utf-8')
          school_intro=Path('app/src/main/java/com/snowmangame/SchoolActivity.java').read_text(encoding='utf-8')
          resume=Path('app/src/main/java/com/snowmangame/ResumeActivity.java').read_text(encoding='utf-8')
          guard=Path('app/src/main/java/com/snowmangame/SchoolProgressionGuard.java').read_text(encoding='utf-8')
          swim=Path('app/src/main/java/com/snowmangame/SnowSwimActivity.java').read_text(encoding='utf-8')
          manifest=Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          gradle=Path('app/build.gradle').read_text(encoding='utf-8')
          checks={
            'challenge snapshot field':'long rewardDay, challengeDay;' in main,
            'active run freezes daily context':'if(startTime!=0)return;' in main,
            '3/day intact':'rewardedBuildsToday<3' in main,
            'school day anti-double-count':'school_player_last_completed_day' in school,
            'grade bounded 2..11':'Math.max(2,Math.min(11,prefs.getInt("school_grade",2)))' in school,
            'grade increments':'grade++' in school and 'grade<11' in school,
            'year completion':'schoolDone>=5&&weekendDone>=2' in school,
            '11th grade final':'grade>=11' in school and 'Шкільний шлях завершено' in school,
            'dinner 3 bites':'Math.min(3,prefs.getInt("school_player_dinner_bites",0))' in school,
            'weekend saves completion':'school_year_complete' in swim and 'school_year_complete_day' in swim,
            'intro cannot reset first class':'putBoolean("school_first_day_complete",false)' not in school_intro,
            'intro routes current grade':'SchoolWeekActivity.class' in school_intro and 'currentGrade()' in school_intro,
            'resume repair':'SchoolProgressionGuard.repair(p);' in resume,
            'guard repairs complete counters':'school>=5&&weekend>=2' in guard and 'putBoolean("school_year_complete",true)' in guard,
            'resume launcher':'.ResumeActivity' in manifest and 'android.intent.action.MAIN' in manifest,
            'versionCode 54':re.search(r'versionCode\s+54\b',gradle) is not None,
            'versionName 18.21':'versionName "18.21"' in gradle,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v18.21 source checks failed: '+'; '.join(failed))

          # Deterministic state-machine smoke test: start grade 2 on Monday,
          # count one real school-life day per date, 5 weekdays + 2 weekend days.
          grade=2
          completed_grades=[]
          for absolute_day in range(200):
              dow=absolute_day % 7  # 0..4 weekday, 5..6 weekend
              if absolute_day % 7 == 0:
                  school_done=0
                  weekend_done=0
              if dow < 5 and school_done < 5:
                  school_done += 1
              elif dow >= 5 and weekend_done < 2:
                  weekend_done += 1
              if school_done == 5 and weekend_done == 2:
                  completed_grades.append(grade)
                  if grade == 11:
                      break
                  grade += 1
          expected=list(range(2,12))
          if completed_grades != expected:
              raise SystemExit(f'grade path broken: {completed_grades!r}')
          if grade != 11:
              raise SystemExit('did not reach grade 11')
          print('Canonical v18.21 source tree OK; school path 2→11 reachable')
          PY
      - name: Build current source tree
        run: gradle assembleRelease --stacktrace --no-daemon
      - name: Decode stable prototype update key
        run: base64 --decode .github/signing/snowman-test-update-key.b64 > "$RUNNER_TEMP/snowman-test-update.jks"
      - name: Align and sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/SnowmanGame-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/snowman-test-update.jks" --ks-key-alias snowman_release --ks-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' --key-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out SnowmanGame.apk "$RUNNER_TEMP/SnowmanGame-aligned.apk"
      - name: Verify installable signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SnowmanGame.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 SnowmanGame.apk
          file SnowmanGame.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SnowmanGame-APK
          path: SnowmanGame.apk
          if-no-files-found: error
