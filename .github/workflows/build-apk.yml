name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        run: |
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Validate canonical source tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main/java/com/snowmangame')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')

          sources = {}
          for path in root.glob('*Activity.java'):
              text = path.read_text(encoding='utf-8')
              m = re.search(r'public\s+class\s+(\w+Activity)\s+extends\s+Activity', text)
              if m:
                  sources[m.group(1)] = path

          registered = set(re.findall(r'android:name="\.([A-Za-z0-9_]+Activity)"', manifest))
          missing = sorted(set(sources) - registered)
          stale = sorted(registered - set(sources))
          if missing:
              raise SystemExit('Activity source missing from manifest: ' + ', '.join(missing))
          if stale:
              raise SystemExit('Manifest points to missing Activity source: ' + ', '.join(stale))

          referenced = set()
          for path in root.glob('*.java'):
              text = path.read_text(encoding='utf-8')
              referenced.update(re.findall(r'\b([A-Za-z0-9_]+Activity)\.class\b', text))
          bad_refs = sorted(referenced - registered)
          if bad_refs:
              raise SystemExit('Intent/Activity reference not registered in manifest: ' + ', '.join(bad_refs))

          checks = {
              'orphan GradeTwo source removed': not (root / 'GradeTwoActivity.java').exists(),
              'no GradeTwo references remain': all('GradeTwoActivity' not in p.read_text(encoding='utf-8') for p in root.glob('*.java')),
              'ClassOne syntax normalized': '[]ys=' not in (root / 'ClassOneActivity.java').read_text(encoding='utf-8'),
              '2-A route is active': 'new Intent(ctx,SchoolWeekActivity.class)' in (root / 'ClassOneActivity.java').read_text(encoding='utf-8'),
              'player-paced prefs present': 'school_year_school_done' in (root / 'SchoolWeekActivity.java').read_text(encoding='utf-8') and 'school_year_weekend_done' in (root / 'SchoolWeekActivity.java').read_text(encoding='utf-8'),
              'school open scheduler connected': 'NotificationScheduler.onSchoolOpened(this);' in (root / 'SchoolWeekActivity.java').read_text(encoding='utf-8'),
              'day completion scheduler connected': 'NotificationScheduler.onDayCompleted(ctx);' in (root / 'SchoolWeekActivity.java').read_text(encoding='utf-8'),
              'date refresh present': 'refreshDateIfNeeded' in (root / 'SchoolWeekActivity.java').read_text(encoding='utf-8'),
              'grade 11 terminal guard present': 'grade>=11' in (root / 'SchoolWeekActivity.java').read_text(encoding='utf-8'),
              'notification permission declared': 'android.permission.POST_NOTIFICATIONS' in manifest,
              'boot permission declared': 'android.permission.RECEIVE_BOOT_COMPLETED' in manifest,
              'reminder receiver declared': 'android:name=".SnowReminderReceiver"' in manifest,
              'version code 41': re.search(r'versionCode\s+41\b', gradle) is not None,
              'version name 18.8': 'versionName "18.8"' in gradle,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Source integrity checks failed: ' + '; '.join(failed))

          print('Canonical source tree OK')
          print('Registered Activities:', ', '.join(sorted(registered)))
          print('Referenced Activities:', ', '.join(sorted(referenced)))
          PY

      - name: Build current source tree
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Decode stable prototype update key
        run: |
          base64 --decode .github/signing/snowman-test-update-key.b64 > "$RUNNER_TEMP/snowman-test-update.jks"

      - name: Align and sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/SnowmanGame-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/snowman-test-update.jks" \
            --ks-key-alias snowman_release \
            --ks-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' \
            --key-pass 'pass:VO@yhMgIcCWXWbN@sa-vqcH%cGPj' \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out SnowmanGame.apk \
            "$RUNNER_TEMP/SnowmanGame-aligned.apk"

      - name: Verify installable signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SnowmanGame.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 SnowmanGame.apk
          file SnowmanGame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnowmanGame-APK
          path: SnowmanGame.apk
          if-no-files-found: error
