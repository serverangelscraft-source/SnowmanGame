name: Build Developer APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tools/prepare_developer_build.py'
      - '.github/workflows/build-developer-apk.yml'
  workflow_dispatch:

jobs:
  build-developer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare developer mode
        run: python3 tools/prepare_developer_build.py

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build developer debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload developer APK
        uses: actions/upload-artifact@v4
        with:
          name: SnowmanGame-DEVELOPER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
