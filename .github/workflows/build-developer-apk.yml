name: Build Developer APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tools/prepare_developer_build.py'
      - '.github/workflows/build-developer-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-developer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        run: |
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Prepare developer mode
        run: python3 tools/prepare_developer_build.py

      - name: Build developer APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload developer APK
        uses: actions/upload-artifact@v4
        with:
          name: SnowmanGame-DEVELOPER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
